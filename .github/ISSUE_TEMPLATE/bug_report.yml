name: 번역·표시 문제 보고
description: 오역, 일본어 잔존, 글자 깨짐과 진행 문제를 보고합니다.
title: "[버그] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        원본 게임 파일, 키와 저장 데이터는 첨부하지 마십시오.

  - type: input
    id: patch-version
    attributes:
      label: 패치 버전
      placeholder: v0.5.0-beta
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: 실행 환경
      options:
        - Nintendo Switch 실기
        - Eden
        - Ryujinx
        - 기타
    validations:
      required: true

  - type: input
    id: scene
    attributes:
      label: 장·장면
      description: 장 번호와 문제가 발생하기 직전 행동을 적어 주십시오.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 실제 문제
      description: 화면에 표시된 문구와 문제를 구체적으로 적어 주십시오.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대한 결과
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: 추가 정보
      description: 스크린샷을 첨부할 수 있습니다.

  - type: checkboxes
    id: no-copyrighted-files
    attributes:
      label: 확인
      options:
        - label: 원본 게임 파일, 키 또는 저장 데이터를 첨부하지 않았습니다.
          required: true
